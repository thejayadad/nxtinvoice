name: CI
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Prisma format & validate
        run: |
          npx prisma format
          npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
